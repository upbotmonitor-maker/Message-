<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>ChatVerse • Bulut Sohbet</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #eae2d6; --header-bg: #075e54; --auth-bg: #f0f2f5; --card-bg: white;
      --text: #111; --text-secondary: #667781; --chat-bg: #e5ddd5;
      --msg-in: white; --msg-out: #dcf8c6; --input-bg: #f0f0f0; --search-bg: white;
      --border: #f1f1f1; --hover: #f5f5f5; --overlay: rgba(0,0,0,0.6);
    }
    body.dark {
      --bg: #0b141a; --header-bg: #1f2c33; --auth-bg: #0b141a; --card-bg: #1f2c33;
      --text: #e9edef; --text-secondary: #8696a0; --chat-bg: #0b141a;
      --msg-in: #1f2c33; --msg-out: #005c4b; --input-bg: #1f2c33; --search-bg: #1f2c33;
      --border: #2a373f; --hover: #2a373f; --overlay: rgba(0,0,0,0.8);
    }
    body { font-family: 'Segoe UI', sans-serif; background: #111; height: 100dvh; display: flex; justify-content: center; align-items: center; color: var(--text); }
    .app-container { width: 100%; max-width: 450px; height: 100dvh; max-height: 100dvh; background: var(--bg); box-shadow: 0 20px 45px rgba(0,0,0,0.4); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .app-header { background: var(--header-bg); color: white; padding: 10px 14px; display: none; align-items: center; gap: 8px; min-height: 56px; z-index: 10; }
    .app-header.visible { display: flex; }
    .back-btn { background: none; border: none; cursor: pointer; display: none; align-items: center; justify-content: center; padding: 4px; color: white; }
    .back-btn.show { display: flex; }
    .header-left { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .header-avatar { width: 38px; height: 38px; border-radius: 50%; background: #128c7e; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 1rem; color: white; flex-shrink: 0; overflow: hidden; cursor: pointer; }
    .header-avatar img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; }
    .header-avatar.show { display: flex; }
    .title { font-size: 1.1rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
    .header-actions { display: flex; align-items: center; gap: 4px; }
    .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .icon-btn:hover { background: rgba(255,255,255,0.15); }
    .logout-btn { background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .screen.active { display: flex; }
    .auth-screen { background: var(--auth-bg); justify-content: center; align-items: center; padding: 20px; gap: 20px; }
    .auth-logo { text-align: center; }
    .logo-circle { width: 70px; height: 70px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
    .auth-logo h1 { color: var(--text); font-size: 1.6rem; }
    .auth-logo p { color: var(--text-secondary); font-size: 0.85rem; }
    .auth-box { background: var(--card-bg); padding: 24px 20px; border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
    .auth-box h2 { color: var(--text); margin-bottom: 18px; font-size: 1.2rem; }
    .input-wrapper { display: flex; align-items: center; background: var(--search-bg); border-radius: 10px; padding: 0 12px; margin-bottom: 10px; border: 1px solid var(--border); }
    .input-wrapper input { width: 100%; padding: 14px 10px; border: none; background: transparent; font-size: 0.95rem; outline: none; color: var(--text); }
    .auth-box > button { width: 100%; background: #25d366; border: none; color: white; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; margin-top: 8px; cursor: pointer; transition: 0.2s; }
    .auth-box > button:hover { background: #1ebc56; }
    .switch-text { margin-top: 14px; color: var(--text-secondary); font-size: 0.9rem; text-align: center; }
    .switch-text a { color: #25d366; text-decoration: none; font-weight: bold; cursor: pointer; }
    .search-bar { display: flex; align-items: center; background: var(--search-bg); margin: 8px 12px; padding: 8px 14px; border-radius: 25px; gap: 10px; border: 1px solid var(--border); }
    .search-bar input { flex: 1; border: none; outline: none; font-size: 0.9rem; background: transparent; color: var(--text); }
    .contact-list { flex: 1; overflow-y: auto; background: var(--card-bg); }
    .contact-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.1s; gap: 12px; }
    .contact-item:hover { background: var(--hover); }
    .contact-avatar { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 1.2rem; overflow: hidden; cursor: pointer; }
    .contact-avatar img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; }
    .contact-info { flex: 1; overflow: hidden; }
    .contact-name { font-weight: 500; font-size: 1rem; display: inline-flex; align-items: center; gap: 4px; color: var(--text); }
    .contact-phone { color: var(--text-secondary); font-size: 0.8rem; margin-top: 2px; }
    .contact-status { font-size: 0.75rem; margin-top: 1px; }
    .contact-status.online { color: #25d366; font-weight: 500; }
    .contact-status.offline { color: #888; }
    .unread-badge { background: #25d366; color: white; border-radius: 50%; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; padding: 0 4px; flex-shrink: 0; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px 12px; background: var(--chat-bg); display: flex; flex-direction: column; gap: 4px; }
    .message-row { display: flex; margin-bottom: 3px; flex-direction: column; }
    .message-row.outgoing { align-items: flex-end; }
    .message-row.incoming { align-items: flex-start; }
    .message-bubble { max-width: 78%; padding: 9px 13px; border-radius: 8px; font-size: 0.95rem; line-height: 1.45; word-break: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.05); color: var(--text); overflow-wrap: anywhere; }
    .outgoing .message-bubble { background: var(--msg-out); border-radius: 8px 2px 8px 8px; }
    .incoming .message-bubble { background: var(--msg-in); border-radius: 2px 8px 8px 8px; }
    .message-time { display: block; text-align: right; font-size: 0.65rem; color: #888; margin-top: 2px; line-height: 1; }
    .chat-input-area { display: flex; padding: 8px 10px; background: var(--input-bg); align-items: center; gap: 6px; flex-shrink: 0; margin-bottom: env(safe-area-inset-bottom, 0px); }
    .chat-input-area input { flex: 1; padding: 10px 14px; border: none; border-radius: 25px; font-size: 0.95rem; outline: none; background: var(--card-bg); color: var(--text); }
    .send-btn { background: #075e54; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .send-btn:active { background: #054d44; }
    .modal-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--overlay); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal-content { background: var(--card-bg); width: 90%; max-width: 380px; border-radius: 16px; overflow: hidden; }
    .modal-header { background: var(--header-bg); color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
    .modal-body { padding: 20px; }
    .setting-item { margin-bottom: 20px; }
    .setting-item label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text); }
    .avatar-upload { display: flex; flex-direction: column; align-items: center; }
    .avatar-preview { width: 90px; height: 90px; border-radius: 50%; background: #e0e0e0; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 2.5rem; color: white; font-weight: bold; }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; }
    #chooseAvatarBtn, #removeAvatarBtn, .save-btn { background: #25d366; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    #removeAvatarBtn { background: #ff4d4f; }
    .save-btn { width: 100%; margin-top: 10px; background: #075e54; }
    .dark-mode-toggle { display: flex; justify-content: space-between; align-items: center; }
    .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #25d366; }
    input:checked + .slider:before { transform: translateX(22px); }
    .profile-card { background: var(--card-bg); width: 88%; max-width: 350px; border-radius: 20px; padding: 0; text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden; }
    .profile-close { position: absolute; top: 8px; right: 14px; color: white !important; font-size: 28px; z-index: 10; }
    .profile-avatar-large { width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 14px; background: #075e54; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: white; font-weight: bold; overflow: hidden; }
    .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; }
    .verified-badge { display: inline-flex; align-items: center; vertical-align: middle; margin-left: 2px; flex-shrink: 0; }
    .verified-badge img { width: 23px; height: 23px; object-fit: contain; pointer-events: none; user-select: none; }
    .name-with-badge { display: inline-flex; align-items: center; vertical-align: middle; gap: 2px; }
    .ai-badge { display: inline-flex; align-items: center; vertical-align: middle; margin-left: 4px; background: #25d366; color: white; font-size: 0.65rem; font-weight: bold; padding: 2px 6px; border-radius: 12px; letter-spacing: 0.5px; pointer-events: none; user-select: none; flex-shrink: 0; }
    .bug-hunter-badge { display: inline-flex; align-items: center; vertical-align: middle; margin-left: 4px; pointer-events: none; user-select: none; flex-shrink: 0; }
    .bug-hunter-badge img { width: 23px; height: 23px; object-fit: contain; }
    .gold-badge { display: inline-flex; align-items: center; vertical-align: middle; margin-left: 4px; pointer-events: none; user-select: none; flex-shrink: 0; }
    .gold-badge img { width: 23px; height: 23px; object-fit: contain; }
    .lumina-status { color: #25d366 !important; font-weight: 500; font-style: italic; }
    .corporate-profile-header { background: linear-gradient(135deg, #1a1a3e, #4a1a6b); padding: 20px; text-align: center; }
    .corporate-profile-logo { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 10px; background: white; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .corporate-profile-logo img { width: 100%; height: 100%; object-fit: cover; }
    .corporate-profile-info { padding: 20px; text-align: left; background: var(--card-bg); }
    .corporate-profile-info p { margin: 8px 0; color: var(--text-secondary); font-size: 0.9rem; }
    .corporate-profile-link { color: #4285F4; text-decoration: none; font-weight: bold; display: block; margin-top: 10px; }
    .block-btn { background: #ff4d4f; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .unblock-btn { background: #25d366; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    .banned-fullscreen { background: #f0f2f5; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 30px; gap: 16px; }
    body.dark .banned-fullscreen { background: #0b141a; }
    .banned-icon { width: 90px; height: 90px; border-radius: 50%; background: #ff4d4f; color: white; font-size: 3rem; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .banned-title { font-size: 1.3rem; font-weight: 600; color: #111; line-height: 1.4; }
    body.dark .banned-title { color: #e9edef; }
    .banned-desc { font-size: 0.9rem; color: #667781; line-height: 1.5; max-width: 300px; }
    .banned-appeal { background: #075e54; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; font-size: 0.9rem; cursor: pointer; margin-top: 8px; }
    .banned-logout { background: none; border: 1px solid #667781; color: #667781; padding: 10px 24px; border-radius: 25px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
    @media (max-width: 500px) { .app-container { max-width: 100%; border-radius: 0; } }
  </style>
</head>
<body>
<div class="app-container">

  let userCacheTime = 0;

  function randomPhone() {
    const c = ['+90','+1','+44','+49','+33','+81','+7','+39'];
    return c[Math.floor(Math.random()*c.length)] + ' ' + Math.floor(100000000+Math.random()*900000000);
  }

  function esc(s) { return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]); }

  // Firebase helpers
  async function getUsers(force = false) {
    if (!force && userCache && Date.now() - userCacheTime < 3000) return userCache;
    const snap = await db.ref('users').once('value');
    userCache = snap.val() || {};
    userCacheTime = Date.now();
    return userCache;
  }

  async function messageListener(userA, userB, callback) {
    const key = [userA, userB].sort().join('_');
    db.ref('messages/' + key).on('value', snap => {
      callback(snap.val() || []);
    });
  }

  async function sendMessageAndListen(userA, userB, msg) {
    const key = [userA, userB].sort().join('_');
    const ref = db.ref('messages/' + key);
    const snap = await ref.once('value');
    const msgs = snap.val() || [];
    msgs.push(msg);
    await ref.set(msgs);
  }

  // Ekran
  function showScreen(s) {
    [authScreen, contactsScreen, chatScreen, bannedScreen].forEach(x => x.classList.remove('active'));
    s.classList.add('active');
  }

  function updateHeader(title, back=false, avatar=null, initial='', partner='') {
    if (partner === VERIFIED_USER) headerTitle.innerHTML = `${partner} <span class="verified-badge"><img src="https://i.imgur.com/14PqZwx.png"></span>`;
    else if (partner === LUMINA_USERNAME) headerTitle.innerHTML = `${partner} <span class="ai-badge">AI</span>`;
    else if (partner === BUGHUNTER_USER) headerTitle.innerHTML = `${partner} <span class="bug-hunter-badge"><img src="${BUGHUNTER_ICON_URL}"></span>`;
    else if (partner === IOBROWSER_USER) headerTitle.innerHTML = `${partner} <span class="gold-badge"><img src="${GOLD_BADGE_URL}"></span>`;
    else headerTitle.textContent = title;

    backBtn.classList.toggle('show', back);
    if (avatar) { headerAvatar.innerHTML = `<img src="${avatar}">`; headerAvatar.classList.add('show'); }
    else if (initial) { headerAvatar.textContent = initial; headerAvatar.classList.add('show'); }
    else if (partner === IOBROWSER_USER) { headerAvatar.innerHTML = `<img src="${IOBROWSER_LOGO}">`; headerAvatar.classList.add('show'); }
    else headerAvatar.classList.remove('show');
  }

  // Auth
  switchLink.addEventListener('click', e => {
    e.preventDefault();
    isLogin = !isLogin;
    document.getElementById('authTitle').textContent = isLogin ? 'Giriş Yap' : 'Kayıt Ol';
    authActionBtn.textContent = isLogin ? 'Giriş Yap' : 'Kayıt Ol';
    switchText.textContent = isLogin ? 'Hesabın yok mu?' : 'Zaten hesabın var mı?';
    switchLink.textContent = isLogin ? 'Kayıt ol' : 'Giriş yap';
  });

  authActionBtn.addEventListener('click', async () => {
    const u = usernameInput.value.trim();
    const p = passwordInput.value.trim();
    if (!u || !p) return alert('Kullanıcı adı ve şifre gerekli.');

    const users = await getUsers(true);
    const banned = (await db.ref('bannedUsers').once('value')).val() || {};

    if (isLogin) {
      const user = users[u];
      if (!user || user.password !== p) return alert('Hatalı giriş.');
      if (banned[u]) { showScreen(bannedScreen); appHeader.classList.remove('visible'); return; }
      currentUser = user;
      await db.ref('users/' + u + '/online').set(true);
      enterApp();
    } else {
      if (users[u]) return alert('Bu kullanıcı adı zaten alınmış.');
      const newUser = { username: u, password: p, phone: randomPhone(), avatar: null, online: true };
      await db.ref('users/' + u).set(newUser);
      currentUser = newUser;
      alert(`Kayıt başarılı!\nNumaran: ${newUser.phone}`);
      enterApp();
    }
    usernameInput.value = '';
    passwordInput.value = '';
  });

  // Çıkış
  logoutBtn.addEventListener('click', async () => {
    if (currentUser) {
      await db.ref('users/' + currentUser.username + '/online').set(false);
    }
    currentUser = null; chatPartner = null;
    showScreen(authScreen); appHeader.classList.remove('visible');
  });

  backBtn.addEventListener('click', () => { chatPartner = null; showContactsScreen(); });
  bannedLogoutBtn.addEventListener('click', async () => {
    if (currentUser) await db.ref('users/' + currentUser.username + '/online').set(false);
    currentUser = null; showScreen(authScreen); appHeader.classList.remove('visible');
  });

  window.addEventListener('beforeunload', async () => {
    if (currentUser) await db.ref('users/' + currentUser.username + '/online').set(false);
  });

  function enterApp() { appHeader.classList.add('visible'); showContactsScreen(); }

  async function showContactsScreen() {
    if (!currentUser) return;
    updateHeader('Sohbetler', false, null, '', '');
    userCache = null;
    const users = await getUsers(true);
    const banned = (await db.ref('bannedUsers').once('value')).val() || {};

    let list = Object.values(users).filter(x => x.username !== currentUser.username && !banned[x.username]);

    // son mesaj zamanı için hızlıca kontrol
    for (let x of list) {
      const key = [currentUser.username, x.username].sort().join('_');
      const snap = await db.ref('messages/' + key + '/lastTime').once('value');
      x.lastTime = snap.val() || 0;
    }
    list.sort((a,b) => b.lastTime - a.lastTime);

    contactListDiv.innerHTML = '';
    if (!list.length) {
      contactListDiv.innerHTML = '<div style="padding:30px;text-align:center;">Henüz kayıtlı kullanıcı yok.</div>';
    } else {
      list.forEach(x => {
        const isV = x.username === VERIFIED_USER;
        const isL = x.username === LUMINA_USERNAME;
        const isB = x.username === BUGHUNTER_USER;
        const isI = x.username === IOBROWSER_USER;
        const av = isI ? `<img src="${IOBROWSER_LOGO}">` : (x.avatar ? `<img src="${x.avatar}">` : x.username.charAt(0).toUpperCase());
        const bg = isI ? 'transparent' : (x.avatar ? 'transparent' : '#075e54');
        const online = isL || isI || x.online;
        const status = isL ? 'Lumina AI' : (isI ? 'IoBrowser' : (online ? 'çevrimiçi' : 'çevrimdışı'));
        const cls = (isL || isI || online) ? 'online' : 'offline';
        const div = document.createElement('div');
        div.className = 'contact-item';
        div.innerHTML = `<div class="contact-avatar" style="background:${bg}">${av}</div>
          <div class="contact-info">
            <span class="contact-name name-with-badge">${x.username} ${isV?'<span class="verified-badge"><img src="https://i.imgur.com/14PqZwx.png"></span>':''} ${isL?'<span class="ai-badge">AI</span>':''} ${isB?`<span class="bug-hunter-badge"><img src="${BUGHUNTER_ICON_URL}"></span>`:''} ${isI?`<span class="gold-badge"><img src="${GOLD_BADGE_URL}"></span>`:''}</span>
            <div class="contact-phone">${x.phone||''}</div>
            <div class="contact-status ${cls}">${status}</div>
          </div>`;
        div.addEventListener('click', () => openChat(x.username));
        contactListDiv.appendChild(div);
      });
    }
    showScreen(contactsScreen);
  }

  function openChat(partner) {
    if (!currentUser) return;
    chatPartner = partner;
    const users = userCache || {};
    const p = users[partner];
    updateHeader(partner, true, p?.avatar||null, '', partner);
    showScreen(chatScreen);

    const key = [currentUser.username, partner].sort().join('_');
    db.ref('messages/' + key).on('value', snap => {
      const msgs = snap.val() || [];
      chatMessages.innerHTML = '';
      msgs.forEach(m => {
        if (typeof m === 'object' && m.from) {
          const d = new Date(m.time);
          const t = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
          const me = m.from === currentUser.username;
          const row = document.createElement('div');
          row.className = `message-row ${me?'outgoing':'incoming'}`;
          row.innerHTML = `<div class="message-bubble">${esc(m.text)}<span class="message-time">${t}</span></div>`;
          chatMessages.appendChild(row);
        }
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });
  }

  sendBtn.addEventListener('click', sendMsg);
  messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMsg(); });

  async function sendMsg() {
    const text = messageInput.value.trim();
    if (!text || !chatPartner || !currentUser) return;
    const msg = { from: currentUser.username, text, time: Date.now() };

    const key = [currentUser.username, chatPartner].sort().join('_');
    const ref = db.ref('messages/' + key);
    const snap = await ref.once('value');
    const msgs = snap.val() || [];
    msgs.push(msg);
    await ref.set(msgs);
    await db.ref('messages/' + key + '/lastTime').set(Date.now());
    messageInput.value = '';

    if (chatPartner === LUMINA_USERNAME) {
      try {
        const res = await fetch('https://chatgpt-production-1b97.up.railway.app/chat', {
          method:'POST', headers:{'Content-Type':'application/json','X-API-Key':'test-api-key-mira-001'},
          body: JSON.stringify({ message: text, user: currentUser.username })
        });
        const data = await res.json();
        let reply = (data.reply||data.message||'Üzgünüm...').replace(/\*\*/g,'');
        msgs.push({ from: LUMINA_USERNAME, text: reply, time: Date.now() });
        await ref.set(msgs);
      } catch(e) {}
    }
  }

  // Ayarlar
  document.getElementById('settingsBtn').addEventListener('click', () => {
    if (!currentUser) return;
    document.getElementById('settingsUsername').textContent = currentUser.username;
    document.getElementById('settingsPhone').textContent = currentUser.phone;
    avatarPreview.innerHTML = currentUser.avatar ? `<img src="${currentUser.avatar}">` : currentUser.username.charAt(0).toUpperCase();
    tempAvatarData = currentUser.avatar;
    darkModeCheckbox.checked = document.body.classList.contains('dark');
    settingsModal.classList.add('show');
  });

  document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsModal.classList.remove('show'));
  document.getElementById('chooseAvatarBtn').addEventListener('click', () => document.getElementById('avatarFileInput').click());

  document.getElementById('avatarFileInput').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => { tempAvatarData = ev.target.result; avatarPreview.innerHTML = `<img src="${tempAvatarData}">`; };
    r.readAsDataURL(f);
  });

  document.getElementById('removeAvatarBtn').addEventListener('click', () => {
    tempAvatarData = null; avatarPreview.innerHTML = currentUser.username.charAt(0).toUpperCase();
  });

  document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
    if (!currentUser) return;
    currentUser.avatar = tempAvatarData;
    await db.ref('users/' + currentUser.username).update({ avatar: tempAvatarData });
    userCache = null;
    settingsModal.classList.remove('show');
    showContactsScreen();
  });

  // Karanlık mod
  function applyDark(on) { document.body.classList.toggle('dark', on); localStorage.setItem('cv_dark', on); }
  darkModeCheckbox.addEventListener('change', () => applyDark(darkModeCheckbox.checked));

  (async function init() {
    const savedDark = localStorage.getItem('cv_dark') === 'true';
    applyDark(savedDark);
    darkModeCheckbox.checked = savedDark;

    const users = await getUsers(true);
    if (!users[VERIFIED_USER]) await db.ref('users/' + VERIFIED_USER).set({ username: VERIFIED_USER, password: 'Bacon2024!', phone: '+1 555 000 0001', avatar: null, online: false });
    if (!users[LUMINA_USERNAME]) await db.ref('users/' + LUMINA_USERNAME).set({ username: LUMINA_USERNAME, password: '', phone: '', avatar: LUMINA_AVATAR_URL, online: true });
    if (!users[IOBROWSER_USER]) await db.ref('users/' + IOBROWSER_USER).set({ username: IOBROWSER_USER, password: '', phone: '', avatar: IOBROWSER_LOGO, online: true });

    const banned = (await db.ref('bannedUsers').once('value')).val() || {};
    if (banned['Nenega']) await db.ref('bannedUsers/Nenega').remove();

    showScreen(authScreen);
  })();
</script>
</body>
</html>
