<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Error 404 (Not Found)!!</title>
    <style>
        /* Tamamen sabit, kaydırılamaz ve fotoğraftaki tasarıma sadık yapı */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Kaydırmayı tamamen engeller */
            background-color: #ffffff;
            font-family: 'Roboto', arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content-wrapper {
            width: 90%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 56px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 32px;
            font-weight: 400;
            color: #70757a;
            margin-bottom: 32px;
        }

        .description {
            font-size: 18px;
            line-height: 1.6;
            color: #5f6368;
            margin-bottom: 32px;
        }

        .highlight {
            font-weight: 700;
            color: #3c4043;
        }

        .bucket-title {
            font-size: 20px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 12px;
        }

        .link-text {
            font-size: 18px;
            color: #5f6368;
        }

        .link-text a {
            color: #1a73e8;
            text-decoration: none;
            cursor: pointer;
        }

        /* Robot İllüstrasyonu - SVG ile Profesyonel Çizim */
        .robot-area {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 180px;
            position: relative;
        }

        .robot-svg {
            width: 100%;
            max-width: 320px;
            height: auto;
        }

        .st0 { fill: none; stroke: #1a73e8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .st1 { fill: #1a73e8; }
    </style>
</head>
<body>

<div class="content-wrapper">
    <h1>Error 404</h1>
    <h2>Object not found</h2>

    <div class="description">
        This object does not exist or is not publicly accessible at this URL. 
        Check the URL of the object that you're looking for or contact 
        <span class="highlight">Chat Verse</span> owner to enable Public access.
    </div>

    <div class="bucket-title">Is this your bucket?</div>
    <div class="link-text">
        Learn how to enable <a href="#">Public Access</a>
    </div>

    <div class="robot-area">
        <svg class="robot-svg" viewBox="0 0 400 150">
            <!-- Sol Robot -->
            <g transform="translate(50, 20)">
                <rect x="20" y="40" width="80" height="65" rx="15" class="st0" />
                <circle cx="45" cy="65" r="7" class="st1" />
                <circle cx="75" cy="65" r="7" class="st1" />
                <path d="M45 85 Q60 78 75 85" class="st0" fill="none" /> <!-- Üzgün Ağız -->
                <line x1="60" y1="40" x2="60" y1="15" class="st0" />
                <circle cx="60" cy="12" r="5" class="st1" />
                <!-- Paletler -->
                <rect x="25" y="105" width="70" height="15" rx="7" class="st0" />
            </g>

            <!-- Sağ Robot (Kollar Yukarıda) -->
            <g transform="translate(200, 20)">
                <rect x="20" y="40" width="80" height="65" rx="15" class="st0" />
                <circle cx="45" cy="65" r="7" class="st1" />
                <circle cx="75" cy="65" r="7" class="st1" />
                <path d="M45 85 Q60 78 75 85" class="st0" fill="none" />
                <line x1="60" y1="40" x2="60" y1="15" class="st0" />
                <circle cx="60" cy="12" r="5" class="st1" />
                <!-- Kollar -->
                <path d="M10 55 L20 45" class="st0" />
                <path d="M110 55 L100 45" class="st0" />
                <!-- Paletler -->
                <rect x="25" y="105" width="70" height="15" rx="7" class="st0" />
            </g>
            
            <!-- Boş Kutular (Bucket Sembolü) -->
            <path d="M160 120 L150 90 L180 90 L170 120 Z" class="st0" />
            <path d="M320 120 L310 100 L340 100 L330 120 Z" class="st0" />
        </svg>
    </div>
</div>

</body>
</html>
