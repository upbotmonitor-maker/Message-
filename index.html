<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>ChatVerse • Sohbet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #eae2d6;
      --header-bg: #075e54;
      --auth-bg: #f0f2f5;
      --card-bg: white;
      --text: #111;
      --text-secondary: #667781;
      --chat-bg: #e5ddd5;
      --msg-in: white;
      --msg-out: #dcf8c6;
      --input-bg: #f0f0f0;
      --search-bg: white;
      --border: #f1f1f1;
      --hover: #f5f5f5;
      --overlay: rgba(0,0,0,0.6);
    }

    body.dark {
      --bg: #0b141a;
      --header-bg: #1f2c33;
      --auth-bg: #0b141a;
      --card-bg: #1f2c33;
      --text: #e9edef;
      --text-secondary: #8696a0;
      --chat-bg: #0b141a;
      --msg-in: #1f2c33;
      --msg-out: #005c4b;
      --input-bg: #1f2c33;
      --search-bg: #1f2c33;
      --border: #2a373f;
      --hover: #2a373f;
      --overlay: rgba(0,0,0,0.8);
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: #111;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100dvh;
      max-height: 100dvh;
      background: var(--bg);
      box-shadow: 0 20px 45px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .app-header {
      background: var(--header-bg);
      color: white;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      z-index: 10;
      display: none;
    }
    .app-header.visible {
      display: flex;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .back-btn.show {
      display: flex;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .header-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #128c7e;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      color: white;
      flex-shrink: 0;
      overflow: hidden;
      cursor: pointer;
    }
    .header-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }
    .header-avatar.show {
      display: flex;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .icon-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .logout-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }
    .screen.active {
      display: flex;
    }

    .auth-screen {
      background: var(--auth-bg);
      justify-content: center;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }

    .auth-logo {
      text-align: center;
    }
    .logo-circle {
      width: 70px;
      height: 70px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
    }
    .auth-logo h1 {
      color: var(--text);
      font-size: 1.6rem;
    }
    .auth-logo p {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .auth-box {
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
    }
    .auth-box h2 {
      color: var(--text);
      margin-bottom: 18px;
      font-size: 1.2rem;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: var(--search-bg);
      border-radius: 10px;
      padding: 0 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .input-wrapper input {
      width: 100%;
      padding: 14px 10px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      outline: none;
      color: var(--text);
    }

    .auth-box > button {
      width: 100%;
      background: #25d366;
      border: none;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .auth-box > button:hover {
      background: #1ebc56;
    }

    .switch-text {
      margin-top: 14px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-align: center;
    }
    .switch-text a {
      color: #25d366;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--search-bg);
      margin: 8px 12px;
      padding: 8px 14px;
      border-radius: 25px;
      gap: 10px;
      border: 1px solid var(--border);
    }
    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.9rem;
      background: transparent;
      color: var(--text);
    }
    .search-bar input::placeholder {
      color: var(--text-secondary);
    }

    .contact-list {
      flex: 1;
      overflow-y: auto;
      background: var(--card-bg);
    }
    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: 0.1s;
      gap: 12px;
    }
    .contact-item:hover {
      background: var(--hover);
    }
    .contact-item:active {
      background: var(--hover);
    }

    .contact-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 1.2rem;
      overflow: hidden;
      cursor: pointer;
    }
    .contact-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    .contact-info {
      flex: 1;
      overflow: hidden;
    }
    .contact-name {
      font-weight: 500;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text);
    }
    .contact-phone {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-top: 2px;
    }
    .contact-status {
      font-size: 0.75rem;
      margin-top: 1px;
    }
    .contact-status.online {
      color: #25d366;
      font-weight: 500;
    }
    .contact-status.offline {
      color: #888;
    }

    .unread-badge {
      background: #25d366;
      color: white;
      border-radius: 50%;
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      background: var(--chat-bg);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-row {
      display: flex;
      margin-bottom: 3px;
    }
    .message-row.outgoing {
      justify-content: flex-end;
    }
    .message-row.incoming {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-break: break-word;
      position: relative;
      box-shadow: 0 1px 1px rgba(0,0,0,0.05);
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .outgoing .message-bubble {
      background: var(--msg-out);
      border-radius: 8px 2px 8px 8px;
    }
    .incoming .message-bubble {
      background: var(--msg-in);
      border-radius: 2px 8px 8px 8px;
    }

    .message-time {
      display: block;
      text-align: right;
      font-size: 0.65rem;
      color: #888;
      margin-top: 2px;
      line-height: 1;
    }

    .chat-input-area {
      display: flex;
      padding: 8px 10px;
      background: var(--input-bg);
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-bottom: env(safe-area-inset-bottom, 0px);
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 25px;
      font-size: 0.95rem;
      outline: none;
      background: var(--card-bg);
      color: var(--text);
    }
    .send-btn {
      background: #075e54;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn:active {
      background: #054d44;
    }

    .emoji-btn, .attach-btn {
      flex-shrink: 0;
    }

    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      width: 90%;
      max-width: 380px;
      border-radius: 16px;
      overflow: hidden;
    }

    .modal-header {
      background: var(--header-bg);
      color: white;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px;
    }

    .setting-item {
      margin-bottom: 20px;
    }
    .setting-item label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text);
    }

    .avatar-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar-preview {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #e0e0e0;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 2.5rem;
      color: white;
      font-weight: bold;
    }
    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    #chooseAvatarBtn, #removeAvatarBtn, .save-btn {
      background: #25d366;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    #removeAvatarBtn {
      background: #ff4d4f;
    }

    .save-btn {
      width: 100%;
      margin-top: 10px;
      background: #075e54;
    }

    .dark-mode-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #25d366;
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .profile-card {
      background: var(--card-bg);
      width: 88%;
      max-width: 350px;
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .profile-close {
      position: absolute;
      top: 8px;
      right: 14px;
      color: var(--text) !important;
      font-size: 28px;
    }
    .profile-avatar-large {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 14px;
      background: #075e54;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: white;
      font-weight: bold;
      overflow: hidden;
    }
    .profile-avatar-large img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    .verified-badge {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin-left: 2px;
      flex-shrink: 0;
    }
    .verified-badge img {
      width: 23px;
      height: 23px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .name-with-badge {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      gap: 2px;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin-left: 4px;
      background: #25d366;
      color: white;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 12px;
      letter-spacing: 1px;
      pointer-events: none;
      user-select: none;
      flex-shrink: 0;
    }

    .lumina-status {
      color: #25d366 !important;
      font-weight: 500;
      font-style: italic;
    }

    @media (max-width: 500px) {
      .app-container {
        max-width: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="app-header" id="appHeader">
      <button class="back-btn" id="backBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="header-left">
        <div class="header-avatar" id="headerAvatar"></div>
        <span class="title" id="headerTitle">Sohbetler</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settingsBtn" title="Ayarlar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="logout-btn" id="logoutBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>

    <div id="authScreen" class="screen active auth-screen">
      <div class="auth-logo">
        <div class="logo-circle">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M17.5 10.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zM3 20.5c0-3.5 7-5.5 11.5-5.5s11.5 2 11.5 5.5"/></svg>
        </div>
        <h1>ChatVerse</h1>
        <p>Güvenli ve hızlı mesajlaşma</p>
      </div>
      <div class="auth-box">
        <h2 id="authTitle">Giriş Yap</h2>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="usernameInput" placeholder="Kullanıcı adı" autocomplete="off">
        </div>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="passwordInput" placeholder="Şifre" autocomplete="off">
        </div>
        <button id="authActionBtn">Giriş Yap</button>
        <p class="switch-text">
          <span id="switchText">Hesabın yok mu?</span>
          <a id="switchLink">Kayıt ol</a>
        </p>
      </div>
    </div>

    <div id="contactsScreen" class="screen">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Kişi ara...">
      </div>
      <div class="contact-list" id="contactList"></div>
    </div>

    <div id="chatScreen" class="screen">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <button class="icon-btn emoji-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </button>
        <input type="text" id="messageInput" placeholder="Mesaj yaz..." autocomplete="off">
        <button class="icon-btn attach-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <button class="send-btn" id="sendBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Ayarlar</h3>
          <button class="modal-close" id="closeSettingsBtn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="setting-item">
            <label>Profil Fotoğrafı</label>
            <div class="avatar-upload">
              <div class="avatar-preview" id="avatarPreview"></div>
              <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
              <button id="chooseAvatarBtn">Galeriden Seç</button>
              <button id="removeAvatarBtn" style="background:#ccc; margin-top:6px;">Kaldır</button>
            </div>
          </div>
          <div class="setting-item">
            <p><strong>Kullanıcı adı:</strong> <span id="settingsUsername"></span></p>
            <p><strong>Telefon:</strong> <span id="settingsPhone"></span></p>
          </div>
          <div class="setting-item dark-mode-toggle">
            <label>Karanlık Mod</label>
            <label class="switch">
              <input type="checkbox" id="darkModeCheckbox">
              <span class="slider round"></span>
            </label>
          </div>
          <button id="saveSettingsBtn" class="save-btn">Kaydet</button>
        </div>
      </div>
    </div>

    <div id="profileModal" class="modal-overlay">
      <div class="profile-card">
        <button class="modal-close profile-close" id="closeProfileBtn">&times;</button>
        <div class="profile-avatar-large" id="profileAvatarLarge"></div>
        <h2 id="profileName"></h2>
        <div id="profileBadge" style="margin-bottom:6px;"></div>
        <p id="profilePhone"></p>
        <p id="profileStatus" style="color:#667781; font-size:0.9rem;"></p>
      </div>
    </div>
  </div>

  <script>
    // ==================== LOCAL STORAGE ====================
    const USERS_KEY = 'cv_users';
    const MESSAGES_PREFIX = 'cv_msg_';
    const CURRENT_USER_KEY = 'cv_current';
    const ONLINE_USERS_KEY = 'cv_online';
    const DARK_MODE_KEY = 'cv_dark';

    function getUsers() {
      return JSON.parse(localStorage.getItem(USERS_KEY)) || [];
    }
    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }
    function getCurrentUser() {
      return JSON.parse(localStorage.getItem(CURRENT_USER_KEY));
    }
    function saveCurrentUser(user) {
      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
    }
    function clearCurrentUser() {
      localStorage.removeItem(CURRENT_USER_KEY);
    }
    function updateCurrentUser(updated) {
      const users = getUsers();
      const idx = users.findIndex(u => u.username === updated.username);
      if (idx !== -1) {
        users[idx] = updated;
        saveUsers(users);
        saveCurrentUser(updated);
      }
    }

    function getOnlineUsers() {
      return JSON.parse(localStorage.getItem(ONLINE_USERS_KEY)) || {};
    }
    function setUserOnline(username) {
      const online = getOnlineUsers();
      online[username] = Date.now();
      localStorage.setItem(ONLINE_USERS_KEY, JSON.stringify(online));
    }
    function setUserOffline(username) {
      const online = getOnlineUsers();
      delete online[username];
      localStorage.setItem(ONLINE_USERS_KEY, JSON.stringify(online));
    }
    function isUserOnline(username) {
      const online = getOnlineUsers();
      return !!online[username];
    }

    function getUnreadCount(currentUser, partner) {
      const key = `unread_${currentUser}_${partner}`;
      return parseInt(localStorage.getItem(key) || '0');
    }
    function incrementUnread(currentUser, partner) {
      const key = `unread_${currentUser}_${partner}`;
      const current = parseInt(localStorage.getItem(key) || '0');
      localStorage.setItem(key, current + 1);
    }
    function resetUnread(currentUser, partner) {
      const key = `unread_${currentUser}_${partner}`;
      localStorage.setItem(key, '0');
    }

    const codes = ['+90','+1','+44','+49','+33','+81','+7','+39'];
    function randomPhone() {
      const c = codes[Math.floor(Math.random() * codes.length)];
      const n = Math.floor(100000000 + Math.random() * 900000000);
      return `${c} ${n}`;
    }

    function chatKey(a, b) {
      const s = [a, b].sort();
      return MESSAGES_PREFIX + s[0] + '_' + s[1];
    }
    function getMsgs(a, b) {
      return JSON.parse(localStorage.getItem(chatKey(a,b))) || [];
    }
    function saveMsgs(a, b, msgs) {
      localStorage.setItem(chatKey(a,b), JSON.stringify(msgs));
    }

    const VERIFIED_USER = 'BaconPrime_Dev';
    const LUMINA_USERNAME = 'Lumina';
    const LUMINA_AVATAR_URL = 'https://i.imgur.com/1I0n5Id.png';

    // ==================== UI ====================
    const appHeader = document.getElementById('appHeader');
    const backBtn = document.getElementById('backBtn');
    const headerAvatar = document.getElementById('headerAvatar');
    const headerTitle = document.getElementById('headerTitle');
    const settingsBtn = document.getElementById('settingsBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    const authScreen = document.getElementById('authScreen');
    const contactsScreen = document.getElementById('contactsScreen');
    const chatScreen = document.getElementById('chatScreen');

    const authTitle = document.getElementById('authTitle');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const authActionBtn = document.getElementById('authActionBtn');
    const switchText = document.getElementById('switchText');
    const switchLink = document.getElementById('switchLink');

    const searchInput = document.getElementById('searchInput');
    const contactListDiv = document.getElementById('contactList');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // Ayarlar modal
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const avatarPreview = document.getElementById('avatarPreview');
    const avatarFileInput = document.getElementById('avatarFileInput');
    const chooseAvatarBtn = document.getElementById('chooseAvatarBtn');
    const removeAvatarBtn = document.getElementById('removeAvatarBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const settingsUsername = document.getElementById('settingsUsername');
    const settingsPhone = document.getElementById('settingsPhone');
    const darkModeCheckbox = document.getElementById('darkModeCheckbox');

    // Profil kartı
    const profileModal = document.getElementById('profileModal');
    const closeProfileBtn = document.getElementById('closeProfileBtn');
    const profileAvatarLarge = document.getElementById('profileAvatarLarge');
    const profileName = document.getElementById('profileName');
    const profileBadge = document.getElementById('profileBadge');
    const profilePhone = document.getElementById('profilePhone');
    const profileStatus = document.getElementById('profileStatus');

    let isLogin = true;
    let chatPartner = null;
    let tempAvatarData = null;

    // ==================== RESİM KORUMASI ====================
    document.addEventListener('contextmenu', (e) => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });
    document.addEventListener('dragstart', (e) => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    // ==================== KARANLIK MOD ====================
    function applyDarkMode(enabled) {
      if (enabled) {
        document.body.classList.add('dark');
      } else {
        document.body.classList.remove('dark');
      }
      localStorage.setItem(DARK_MODE_KEY, enabled);
    }

    (function loadDarkMode() {
      const saved = localStorage.getItem(DARK_MODE_KEY);
      if (saved === 'true') {
        applyDarkMode(true);
        if (darkModeCheckbox) darkModeCheckbox.checked = true;
      } else {
        applyDarkMode(false);
        if (darkModeCheckbox) darkModeCheckbox.checked = false;
      }
    })();

    darkModeCheckbox.addEventListener('change', () => {
      applyDarkMode(darkModeCheckbox.checked);
    });

    // ==================== EKRAN ====================
    function showScreen(scr) {
      authScreen.classList.remove('active');
      contactsScreen.classList.remove('active');
      chatScreen.classList.remove('active');
      scr.classList.add('active');
    }

    function updateHeaderUI(titleText, showBack = false, avatarSrc = null, initial = '', partnerUsername = '') {
      if (partnerUsername === VERIFIED_USER) {
        headerTitle.innerHTML = `${partnerUsername} <span class="verified-badge"><img src="https://i.imgur.com/14PqZwx.png" alt="✓"></span>`;
      } else if (partnerUsername === LUMINA_USERNAME) {
        headerTitle.innerHTML = `${partnerUsername} <span class="ai-badge">AI</span>`;
      } else {
        headerTitle.textContent = titleText;
      }

      backBtn.classList.toggle('show', showBack);

      if (avatarSrc) {
        headerAvatar.innerHTML = `<img src="${avatarSrc}" alt="pf">`;
        headerAvatar.classList.add('show');
      } else if (initial) {
        headerAvatar.innerHTML = '';
        headerAvatar.textContent = initial;
        headerAvatar.classList.add('show');
      } else {
        headerAvatar.classList.remove('show');
      }

      headerAvatar.onclick = () => {
        if (partnerUsername) showProfileCard(partnerUsername);
      };
    }

    // ==================== PROFİL KARTI ====================
    function showProfileCard(username) {
      const user = getUsers().find(u => u.username === username);
      if (!user) return;
      profileName.textContent = user.username;
      profilePhone.textContent = user.phone || '—';
      if (user.username === VERIFIED_USER) {
        profileBadge.innerHTML = '<span class="verified-badge"><img src="https://i.imgur.com/14PqZwx.png" alt="✓" style="width:23px;height:23px;"></span>';
      } else if (user.username === LUMINA_USERNAME) {
        profileBadge.innerHTML = '<span class="ai-badge">AI</span>';
      } else {
        profileBadge.innerHTML = '';
      }
      profileStatus.textContent = user.username === LUMINA_USERNAME ? 'Lumina | Groq + Llama 3.3 70B' : (isUserOnline(user.username) ? 'çevrimiçi' : 'çevrimdışı');
      profileStatus.className = user.username === LUMINA_USERNAME ? 'lumina-status' : '';
      profileAvatarLarge.innerHTML = user.avatar
        ? `<img src="${user.avatar}" alt="pf">`
        : user.username === LUMINA_USERNAME ? `<img src="${LUMINA_AVATAR_URL}" alt="pf">` : user.username.charAt(0).toUpperCase();
      profileAvatarLarge.style.background = user.avatar ? 'transparent' : (user.username === LUMINA_USERNAME ? 'transparent' : avatarColor(user.username));
      profileModal.classList.add('show');
    }

    closeProfileBtn.addEventListener('click', () => {
      profileModal.classList.remove('show');
    });
    profileModal.addEventListener('click', (e) => {
      if (e.target === profileModal) profileModal.classList.remove('show');
    });

    // ==================== AUTH ====================
    switchLink.addEventListener('click', (e) => {
      e.preventDefault();
      isLogin = !isLogin;
      if (isLogin) {
        authTitle.textContent = 'Giriş Yap';
        authActionBtn.textContent = 'Giriş Yap';
        switchText.textContent = 'Hesabın yok mu?';
        switchLink.textContent = 'Kayıt ol';
      } else {
        authTitle.textContent = 'Kayıt Ol';
        authActionBtn.textContent = 'Kayıt Ol';
        switchText.textContent = 'Zaten hesabın var mı?';
        switchLink.textContent = 'Giriş yap';
      }
    });

    authActionBtn.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username || !password) {
        alert('Kullanıcı adı ve şifre gerekli.');
        return;
      }
      let users = getUsers();

      if (isLogin) {
        const user = users.find(u => u.username === username && u.password === password);
        if (!user) {
          alert('Kullanıcı adı veya şifre hatalı.');
          return;
        }
        saveCurrentUser(user);
        setUserOnline(user.username);
        enterApp();
      } else {
        if (users.some(u => u.username === username)) {
          alert('Bu kullanıcı adı alınmış.');
          return;
        }
        const newUser = {
          username,
          password,
          phone: randomPhone(),
          avatar: null,
        };
        users.push(newUser);
        saveUsers(users);
        saveCurrentUser(newUser);
        setUserOnline(newUser.username);
        alert(`Kayıt başarılı!\nNumaran: ${newUser.phone}`);
        enterApp();
      }
      usernameInput.value = '';
      passwordInput.value = '';
    });

    // Çıkış
    logoutBtn.addEventListener('click', () => {
      const cu = getCurrentUser();
      if (cu) setUserOffline(cu.username);
      clearCurrentUser();
      chatPartner = null;
      showScreen(authScreen);
      appHeader.classList.remove('visible');
    });

    // Geri
    backBtn.addEventListener('click', () => {
      if (chatPartner) {
        const cu = getCurrentUser();
        if (cu) resetUnread(cu.username, chatPartner);
      }
      chatPartner = null;
      showContactsScreen();
    });

    window.addEventListener('beforeunload', () => {
      const cu = getCurrentUser();
      if (cu) setUserOffline(cu.username);
    });

    // ==================== REHBER ====================
    function enterApp() {
      appHeader.classList.add('visible');
      showContactsScreen();
    }

    function showContactsScreen() {
      const cu = getCurrentUser();
      if (!cu) {
        showScreen(authScreen);
        return;
      }
      updateHeaderUI('Sohbetler', false, null, '', '');

      let users = getUsers().filter(u => u.username !== cu.username);

      users.sort((a, b) => {
        const msgsA = getMsgs(cu.username, a.username);
        const msgsB = getMsgs(cu.username, b.username);
        const timeA = msgsA.length ? msgsA[msgsA.length - 1].time : 0;
        const timeB = msgsB.length ? msgsB[msgsB.length - 1].time : 0;
        return timeB - timeA;
      });

      renderContactList(users);
      showScreen(contactsScreen);
    }

    function renderContactList(users) {
      contactListDiv.innerHTML = '';
      const cu = getCurrentUser();

      if (users.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.style.cssText = 'padding:30px;text-align:center;color:var(--text-secondary);';
        emptyMsg.textContent = 'Henüz kayıtlı kullanıcı yok.';
        contactListDiv.appendChild(emptyMsg);
        return;
      }

      users.forEach(u => {
        const isVerified = (u.username === VERIFIED_USER);
        const isLumina = (u.username === LUMINA_USERNAME);
        const avatarHTML = u.avatar
          ? `<img src="${u.avatar}" alt="pf">`
          : isLumina ? `<img src="${LUMINA_AVATAR_URL}" alt="pf">` : u.username.charAt(0).toUpperCase();
        const bg = u.avatar ? 'transparent' : (isLumina ? 'transparent' : avatarColor(u.username));
        const online = isLumina ? true : isUserOnline(u.username);
        const statusText = isLumina ? 'Lumina | Groq + Llama 3.3 70B' : (online ? 'çevrimiçi' : 'çevrimdışı');
        const statusClass = isLumina ? 'lumina-status' : (online ? 'online' : 'offline');

        const unread = getUnreadCount(cu.username, u.username);

        const div = document.createElement('div');
        div.className = 'contact-item';
        div.innerHTML = `
          <div class="contact-avatar" style="background:${bg}" data-username="${u.username}">
            ${avatarHTML}
          </div>
          <div class="contact-info">
            <span class="contact-name name-with-badge">
              ${u.username}
              ${isVerified ? '<span class="verified-badge"><img src="https://i.imgur.com/14PqZwx.png" alt="✓"></span>' : ''}
              ${isLumina ? '<span class="ai-badge">AI</span>' : ''}
            </span>
            <div class="contact-phone">${u.phone || ''}</div>
            <div class="contact-status ${statusClass}">${statusText}</div>
          </div>
          ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
        `;

        const avatarEl = div.querySelector('.contact-avatar');
        avatarEl.addEventListener('click', (e) => {
          e.stopPropagation();
          showProfileCard(u.username);
        });

        div.addEventListener('click', (e) => {
          if (!e.target.closest('.contact-avatar')) {
            openChat(u.username);
          }
        });

        contactListDiv.appendChild(div);
      });
    }

    searchInput.addEventListener('input', () => {
      const cu = getCurrentUser();
      if (!cu) return;
      const q = searchInput.value.toLowerCase();
      let users = getUsers().filter(u => u.username !== cu.username && u.username.toLowerCase().includes(q));
      users.sort((a, b) => {
        const msgsA = getMsgs(cu.username, a.username);
        const msgsB = getMsgs(cu.username, b.username);
        const timeA = msgsA.length ? msgsA[msgsA.length - 1].time : 0;
        const timeB = msgsB.length ? msgsB[msgsB.length - 1].time : 0;
        return timeB - timeA;
      });
      renderContactList(users);
    });

    // ==================== SOHBET ====================
    function openChat(partner) {
      chatPartner = partner;
      const cu = getCurrentUser();
      if (!cu) return;

      resetUnread(cu.username, partner);

      const partnerUser = getUsers().find(u => u.username === partner);
      const initial = partner === LUMINA_USERNAME ? '' : partner.charAt(0).toUpperCase();
      const avatarSrc = partnerUser?.avatar || (partner === LUMINA_USERNAME ? LUMINA_AVATAR_URL : null);
      updateHeaderUI(partner, true, avatarSrc, initial, partner);
      showScreen(chatScreen);
      renderMessages();
    }

    function renderMessages() {
      const cu = getCurrentUser();
      if (!cu || !chatPartner) return;
      const msgs = getMsgs(cu.username, chatPartner);
      chatMessages.innerHTML = '';

      msgs.forEach(m => {
        const time = new Date(m.time);
        const hours = time.getHours().toString().padStart(2, '0');
        const minutes = time.getMinutes().toString().padStart(2, '0');
        const timeStr = `${hours}:${minutes}`;

        const row = document.createElement('div');
        row.className = `message-row ${m.from === cu.username ? 'outgoing' : 'incoming'}`;
        row.innerHTML = `
          <div class="message-bubble">
            ${esc(m.text)}
            <span class="message-time">${timeStr}</span>
          </div>
        `;
        chatMessages.appendChild(row);
      });

      requestAnimationFrame(() => {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }

    sendBtn.addEventListener('click', sendMsg);
    messageInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMsg();
    });

    async function sendMsg() {
      const text = messageInput.value.trim();
      if (!text || !chatPartner) return;
      const cu = getCurrentUser();
      if (!cu) return;

      // Lumina koruması tamamen kaldırıldı, herkes kullanabilir

      const msgs = getMsgs(cu.username, chatPartner);
      msgs.push({ from: cu.username, text, time: Date.now() });
      saveMsgs(cu.username, chatPartner, msgs);
      messageInput.value = '';
      renderMessages();

      if (chatPartner === LUMINA_USERNAME) {
        try {
          const response = await fetch('https://chatgpt-production-1b97.up.railway.app/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-API-Key': 'test-api-key-mira-001'
            },
            body: JSON.stringify({
              message: text,
              user: cu.username
            })
          });
          const data = await response.json();
          let reply = data.reply || data.message || 'Üzgünüm, şu anda yanıt veremiyorum.';
          reply = reply.replace(/\*\*/g, '');
          const updatedMsgs = getMsgs(cu.username, chatPartner);
          updatedMsgs.push({ from: LUMINA_USERNAME, text: reply, time: Date.now() });
          saveMsgs(cu.username, chatPartner, updatedMsgs);
          renderMessages();

          showContactsScreen();
          if (chatPartner) openChat(chatPartner);
        } catch (err) {
          const updatedMsgs = getMsgs(cu.username, chatPartner);
          updatedMsgs.push({ from: LUMINA_USERNAME, text: '⚠️ API bağlantı hatası. Lütfen tekrar deneyin.', time: Date.now() });
          saveMsgs(cu.username, chatPartner, updatedMsgs);
          renderMessages();
        }
      } else {
        incrementUnread(chatPartner, cu.username);
        showContactsScreen();
        openChat(chatPartner);
      }
    }

    function esc(s) {
      return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]);
    }

    function avatarColor(name) {
      const colors = ['#075e54','#128c7e','#25d366','#1ebc56','#0b5e42','#2e7d32','#388e3c','#4caf50'];
      let hash = 0;
      for (let i=0; i<name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    // ==================== AYARLAR ====================
    settingsBtn.addEventListener('click', () => {
      const cu = getCurrentUser();
      if (!cu) return;
      settingsUsername.textContent = cu.username;
      settingsPhone.textContent = cu.phone;
      avatarPreview.innerHTML = '';
      if (cu.avatar) {
        avatarPreview.innerHTML = `<img src="${cu.avatar}" alt="pf">`;
      } else {
        avatarPreview.textContent = cu.username.charAt(0).toUpperCase();
        avatarPreview.style.background = avatarColor(cu.username);
      }
      tempAvatarData = cu.avatar;
      darkModeCheckbox.checked = document.body.classList.contains('dark');
      settingsModal.classList.add('show');
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsModal.classList.remove('show');
    });

    chooseAvatarBtn.addEventListener('click', () => {
      avatarFileInput.click();
    });

    avatarFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        tempAvatarData = ev.target.result;
        avatarPreview.innerHTML = `<img src="${tempAvatarData}" alt="pf">`;
      };
      reader.readAsDataURL(file);
    });

    removeAvatarBtn.addEventListener('click', () => {
      tempAvatarData = null;
      avatarPreview.innerHTML = '';
      const cu = getCurrentUser();
      avatarPreview.textContent = cu.username.charAt(0).toUpperCase();
      avatarPreview.style.background = avatarColor(cu.username);
    });

    saveSettingsBtn.addEventListener('click', () => {
      const cu = getCurrentUser();
      if (!cu) return;
      cu.avatar = tempAvatarData;
      updateCurrentUser(cu);
      settingsModal.classList.remove('show');
      showContactsScreen();
      if (chatPartner) {
        openChat(chatPartner);
      }
    });

    // ==================== BAŞLANGIÇ ====================
    (function init() {
      let users = getUsers();

      const bacon = users.find(u => u.username === VERIFIED_USER);
      if (!bacon) {
        users.push({
          username: VERIFIED_USER,
          password: 'Bacon2024!',
          phone: '+1 555 000 0001',
          avatar: null
        });
      } else {
        if (!bacon.phone || bacon.phone.startsWith('+90')) {
          bacon.phone = '+1 555 000 0001';
        }
      }

      if (!users.some(u => u.username === LUMINA_USERNAME)) {
        users.push({
          username: LUMINA_USERNAME,
          password: '',
          phone: '',
          avatar: LUMINA_AVATAR_URL
        });
      } else {
        const lumina = users.find(u => u.username === LUMINA_USERNAME);
        if (lumina) {
          lumina.phone = '';
          lumina.avatar = LUMINA_AVATAR_URL;
        }
      }

      saveUsers(users);

      const cu = getCurrentUser();
      if (cu) {
        setUserOnline(cu.username);
        setUserOnline(LUMINA_USERNAME);
        enterApp();
      } else {
        showScreen(authScreen);
        appHeader.classList.remove('visible');
      }
    })();
  </script>
</body>
</html>
