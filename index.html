<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatVerse • Yayından Kalktı</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b141a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      overflow: hidden;
    }
    
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4), transparent),
                  radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.3), transparent),
                  radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.5), transparent),
                  radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.2), transparent),
                  radial-gradient(1px 1px at 70% 50%, rgba(255,255,255,0.4), transparent),
                  radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.3), transparent),
                  radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.5), transparent),
                  radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.2), transparent),
                  radial-gradient(1px 1px at 30% 90%, rgba(255,255,255,0.4), transparent);
      background-size: 200px 200px;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    
    @keyframes twinkle {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    
    .container {
      position: relative;
      z-index: 1;
      padding: 40px;
      max-width: 500px;
    }
    
    .logo-circle {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #075e54, #128c7e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      box-shadow: 0 0 40px rgba(7, 94, 84, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(7, 94, 84, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(7, 94, 84, 0.6); }
    }
    
    .logo-circle svg {
      width: 40px;
      height: 40px;
    }
    
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #e9edef;
    }
    
    .subtitle {
      font-size: 1.1rem;
      color: #8696a0;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    
    .badge-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    
    .badge {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #8696a0;
      backdrop-filter: blur(10px);
    }
    
    .footer-text {
      font-size: 0.75rem;
      color: #555;
      margin-top: 40px;
    }
    
    .footer-text span {
      color: #25d366;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  
  <div class="container">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M17.5 10.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zM3 20.5c0-3.5 7-5.5 11.5-5.5s11.5 2 11.5 5.5"/>
      </svg>
    </div>
    
    <h1>ChatVerse Yayından Kalktı</h1>
    <p class="subtitle">Bu proje, bir dönemin efsanesi olarak arşivlere geçti.<br>Teşekkürler BaconPrime_Dev.</p>
    
    <div class="badge-row">
      <span class="badge">🔵 Mavi Tik</span>
      <span class="badge">🤖 AI Rozeti</span>
      <span class="badge">🥇 Altın Rozet</span>
      <span class="badge">🛡️ Bug Hunter</span>
    </div>
    
    <p class="footer-text">Bir <span>ChatVerse</span> prodüksiyonu • 2024 – 2025</p>
  </div>
</body>
</html>
